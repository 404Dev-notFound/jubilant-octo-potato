# ==============================================================================
# Netlify Production Configuration
# ==============================================================================
[build]
  publish = "."

[[redirects]]
  from = "/api/*"
  to = "https://jubilant-octo-potato-production.up.railway.app/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/health"
  to = "https://jubilant-octo-potato-production.up.railway.app/health"
  status = 200
  force = true

[[redirects]]
  from = "/healthz"
  to = "https://jubilant-octo-potato-production.up.railway.app/healthz"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
